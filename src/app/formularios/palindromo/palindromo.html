<div class="container mt-4">
  <h2>Analizador de Palíndromos</h2>
  
  <form>
    <div class="form-group pt-3">
      <label for="frase">Ingresa una frase:</label>
      <input 
        type="text" 
        id="frase" 
        name="frase" 
        class="form-control" 
        placeholder="Ejemplo: Anita lava la tina" 
        [(ngModel)]="textoEntrada"
      >
    </div>

    <button type="button" class="btn btn-primary mt-3" (click)="analizar()">
      Analizar Frase
    </button>
  </form>

  <hr />

  <div class="results-section" *ngIf="esPalindromoResultado">
    <h3>Resultados:</h3>
    
    <p><strong>Número de Vocales:</strong> {{ numVocales }}</p>
    <p><strong>Vocales encontradas:</strong> {{ vocalesEncontradas.join(', ') }}</p>
    
    <p><strong>Número de Consonantes:</strong> {{ numConsonantes }}</p>
    <p><strong>Consonantes encontradas:</strong> {{ consonantesEncontradas.join(', ') }}</p>
    
    <h4><strong>Resultado del Palíndromo:</strong> {{ esPalindromoResultado }}</h4>
  </div>
</div>
