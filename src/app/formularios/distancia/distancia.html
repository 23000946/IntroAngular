<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
            
            <div class="col-6">
                <form>
                <div class="form-group pt-4">
                    <label for="num1">Numero 1</label>
                    <input [(ngModel)]="num1" name="num1" type="text" class="form-control"
                    placeholder="Ingrese x2">
                </div>
                <div>
                    <label for="num2">Numero 2</label>
                    <input [(ngModel)]="num2" name="num2" type="text" class="form-control"
                    placeholder="Ingrese x1">
                </div>
                <div>
                    <label for="num2">Numero 2</label>
                    <input [(ngModel)]="num3" name="num3" type="text" class="form-control"
                    placeholder="Ingrese y2">
                </div>
                <div>
                    <label for="num2">Numero 2</label>
                    <input [(ngModel)]="num4" name="num4" type="text" class="form-control"
                    placeholder="Ingrese y1">
                </div>
                <br />
                <button (click)="Distancia()" type="button" class="btn btn-primary">Calculo</button>
                <br />
                <div class="col-6">
                    <h2>Resultado: {{Resultado}}</h2>
                </div>

                </form>

            </div>
        </div>
    </div>
</body>
</html>
